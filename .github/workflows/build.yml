name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.27.4"
  MYGO_VERSION: "v0.8.3"
  CI: "true"

jobs:
  verify:
    name: go vet + wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Build the browser bundle
        run: GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o /tmp/app.wasm ./cmd/chuan

  macos:
    name: macOS (arm64 + amd64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install mygo CLI
        run: go install github.com/egoist/mygo/cmd/mygo@${{ env.MYGO_VERSION }}
      - name: Draw the app icon
        run: go run ./tools/genicon
      - name: Build app and dmg
        run: mygo build -platform "darwin/arm64,darwin/amd64"
      - uses: actions/upload-artifact@v4
        with:
          name: chuan-macos
          path: build/darwin-*/
          if-no-files-found: error

  windows:
    name: Windows (x64 + arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install mygo CLI
        run: go install github.com/egoist/mygo/cmd/mygo@${{ env.MYGO_VERSION }}
      - name: Draw the app icon
        run: go run ./tools/genicon
      - name: Build installers
        run: mygo build -platform "windows/amd64,windows/arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: chuan-windows
          path: build/windows-*/
          if-no-files-found: error

  web:
    name: Browser (js/wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build browser bundle
        run: ./scripts/build-web.sh build/web
      - uses: actions/upload-artifact@v4
        with:
          name: chuan-web
          path: build/web/
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Draw the app icon
        run: go run ./tools/genicon
      - name: Build browser bundle for the WebView shell
        run: ./scripts/build-web.sh android/app/src/main/assets/web
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Collect APK
        run: |
          mkdir -p build/android
          cp android/app/build/outputs/apk/debug/app-debug.apk build/android/chuan-mygo-0.1.0-debug.apk
          ls -lh build/android
      - uses: actions/upload-artifact@v4
        with:
          name: chuan-android
          path: build/android/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            cp "$f" "dist/$(basename "$f")"
          done
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
