name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "发布到 Releases（填 v0.1.0 这样的标签名，留空只构建）"
        required: false
        default: ""

env:
  GO_VERSION: "1.27.4"
  MYGO_VERSION: "v0.8.3"
  CI: "true"

jobs:
  verify:
    name: go vet + wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: xvfb-run -a go test -race ./...
      - name: Build the browser bundle
        run: GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o /tmp/app.wasm ./cmd/chuan

  macos:
    name: macOS (arm64 + amd64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install mygo CLI
        run: go install github.com/egoist/mygo/cmd/mygo@${{ env.MYGO_VERSION }}
      - name: Draw the app icon
        run: go run ./tools/genicon
      - name: Build app and dmg
        run: mygo build -platform "darwin/arm64,darwin/amd64"
      - uses: actions/upload-artifact@v4
        with:
          name: chuan-macos
          path: build/darwin-*/
          if-no-files-found: error

  windows:
    name: Windows (x64 + arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install mygo CLI
        run: go install github.com/egoist/mygo/cmd/mygo@${{ env.MYGO_VERSION }}
      - name: Draw the app icon
        run: go run ./tools/genicon
      - name: Build installers
        run: mygo build -platform "windows/amd64,windows/arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: chuan-windows
          path: build/windows-*/
          if-no-files-found: error

  web:
    name: Browser (js/wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build browser bundle
        run: bash scripts/build-web.sh build/web
      - uses: actions/upload-artifact@v4
        with:
          name: chuan-web
          path: build/web/
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Draw the app icon
        run: go run ./tools/genicon
      - name: Build browser bundle for the WebView shell
        run: bash scripts/build-web.sh android/app/src/main/assets/web
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Collect APK
        run: |
          mkdir -p build/android
          cp android/app/build/outputs/apk/debug/app-debug.apk build/android/chuan-mygo-0.1.0-debug.apk
          ls -lh build/android
      - uses: actions/upload-artifact@v4
        with:
          name: chuan-android
          path: build/android/*.apk
          if-no-files-found: error

  plan:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release }}" ]; then
            tag="${{ inputs.release }}"
          elif [ -f release-tag.txt ]; then
            tag="$(tr -d '[:space:]' < release-tag.txt)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none}"

  release:
    name: Publish release
    if: needs.plan.outputs.tag != ''
    needs: [plan, macos, windows, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # macOS: the .dmg already contains the .app bundle
          find artifacts -type f -name '*.dmg' -exec cp {} dist/ \;
          # windows: keep only the NSIS installers, drop the bare binary
          find artifacts -type f -name '*setup*.exe' -exec cp {} dist/ \;
          find artifacts -type f -name '*.apk' -exec cp {} dist/ \;
          if [ -d artifacts/chuan-web ]; then
            tar -C artifacts/chuan-web -czf dist/chuan-mygo-web.tar.gz .
          fi
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: 文件快传 ${{ needs.plan.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: false
