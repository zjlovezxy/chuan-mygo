<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />
    <title>文件快传</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #09090b;
        color: #a1a1aa;
        font: 13px system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #09090b;
        transition: opacity 160ms ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      .pulse {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: #e11d48;
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.86); opacity: 0.75; }
        50% { transform: scale(1); opacity: 1; }
      }
      #boot p { margin: 0; font-size: 12px; letter-spacing: 0.4px; }
      #boot pre {
        max-width: 82%;
        white-space: pre-wrap;
        color: #fca5a5;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div id="boot"><div class="pulse"></div><p>正在启动…</p></div>
    <script src="wasm_exec.js"></script>
    <script src="bridge.js"></script>
    <script>
      (function () {
        const boot = document.getElementById("boot");
        function fail(err) {
          boot.classList.remove("gone");
          boot.replaceChildren();
          const pre = document.createElement("pre");
          pre.textContent = "启动失败：" + err;
          boot.append(pre);
        }
        function start(go, instance) {
          boot.classList.add("gone");
          setTimeout(() => boot.remove(), 300);
          go.run(instance);
        }
        async function load() {
          const go = new Go();
          let instance;
          try {
            const result = await WebAssembly.instantiateStreaming(fetch("app.wasm"), go.importObject);
            instance = result.instance;
          } catch (streamErr) {
            const buffer = await (await fetch("app.wasm")).arrayBuffer();
            const result = await WebAssembly.instantiate(buffer, go.importObject);
            instance = result.instance;
          }
          start(go, instance);
        }
        window.addEventListener("error", (e) => fail(e.message || e));
        load().catch(fail);
      })();
    </script>
  </body>
</html>
